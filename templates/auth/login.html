<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — CyberShield AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('main.index') }}" style="text-decoration:none; color:inherit;">
      <span class="brand-text">CyberShield<span class="brand-ai">AI</span></span>
    </a>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="auth-sub">Access your scan history and saved reports.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="auth-flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="auth-field">
        <label for="identifier">Username or email</label>
        <input type="text" id="identifier" name="identifier" value="{{ identifier or '' }}" required autofocus>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="auth-submit">Sign In</button>
    </form>

    <p class="auth-footer-link">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
    </p>
  </div>
</main>

</body>
</html>
